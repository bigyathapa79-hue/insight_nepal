<!doctype html>
<html lang="en">
  <head>
    <!-- Character Encoding -->
    <meta charset="UTF-8" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>Insight Nepal | Latest News, Politics, Business, Sports & Technology</title>

    <!-- SEO -->
    <meta
      name="description"
      content="Insight Nepal delivers the latest breaking news from Nepal and around the world. Read politics, business, technology, sports, entertainment, health, and lifestyle news."
    />

    <meta
      name="keywords"
      content="Nepal News, Insight Nepal, Breaking News Nepal, Politics, Sports, Business, Technology, Entertainment"
    />

    <meta name="author" content="Insight Nepal" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://insightnepal.com/" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#DC2626" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/images/logo/favicon.png" />
    <link rel="apple-touch-icon" href="/images/logo/apple-touch-icon.png" />

    <!-- Open Graph (Facebook, LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Insight Nepal" />
    <meta property="og:title" content="Insight Nepal" />
    <meta
      property="og:description"
      content="Latest breaking news from Nepal and around the world."
    />
    <meta property="og:image" content="/images/logo/cover.png" />
    <meta property="og:url" content="https://insightnepal.com/" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Insight Nepal" />
    <meta
      name="twitter:description"
      content="Latest breaking news from Nepal and around the world."
    />
    <meta name="twitter:image" content="/images/logo/cover.png" />

    <!-- Microsoft -->
    <meta name="msapplication-TileColor" content="#DC2626" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
